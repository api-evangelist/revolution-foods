aid: revolution-foods
name: Revolution Foods
description: 'Revolution Foods is an Oakland, California food company founded in 2006 by Kristin
  Groos Richmond and Kirsten Saenz Tobey that manufactures and delivers nutritious, freshly prepared
  meals to schools and senior communities. It is the largest K-12 school meal vendor in California,
  serving more than 35 million meals a year across 800+ schools and senior centers, with programs
  spanning district and charter school food service, after-school and summer meals, senior center
  dining and homebound delivery. The company has been a Certified B Corporation since 2009 and a
  Public Benefit Corporation since 2021, and reports a 100% audit pass rate across NSLP, SBP, CACFP,
  SFSP and Title III compliance. Customers order through Centro, a login-gated web ordering portal;
  Revolution Foods publishes no public developer program, API documentation, or machine-readable
  specification of any kind.'
